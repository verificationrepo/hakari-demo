function nav(f){var a=f.getAttribute('action')||'';ov(M==='before'?'このまま公開すると、入力内容が仮のアドレス宛て（'+a.replace(/^https?:\/\//,'')+'）に送信されます。デモでは止めています。':M==='fail'?'本来はここで送信サービス（'+a.replace(/^https?:\/\/([^\/]+).*/,'$1')+'）の画面に移動し、そちらでエラーが表示されます。フォーム自身はエラーを表示しません。':'本来はここで送信サービス（'+a.replace(/^https?:\/\/([^\/]+).*/,'$1')+'）の画面に移動し、入力内容がお店のメールに届きます。デモのため送信していません。')}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こむぎ堂 ご予約フォーム</title>
<style>
  :root {
    --bg: #faf6ef;
    --card: #ffffff;
    --text: #3b2f25;
    --muted: #7a6a5b;
    --accent: #b5732f;
    --accent-dark: #8f5a22;
    --border: #e4d8c7;
    --error: #b3261e;
    --ok: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1a15;
      --card: #2a231c;
      --text: #f1e8dc;
      --muted: #bfae98;
      --accent: #d9944a;
      --accent-dark: #e8a964;
      --border: #44392d;
      --error: #f2867d;
      --ok: #81c784;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  header { text-align: center; margin-bottom: 24px; }
  header .logo { font-size: 40px; line-height: 1; }
  header h1 { margin: 8px 0 4px; font-size: 26px; letter-spacing: .08em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  form, .done {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 20px;
  }
  .field { margin-bottom: 20px; }
  label, legend { display: block; font-weight: bold; margin-bottom: 6px; }
  .req { color: var(--error); font-size: 12px; margin-left: 6px; font-weight: normal; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  input[type=text], input[type=tel], input[type=date], select, textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  fieldset { border: 0; padding: 0; margin: 0 0 20px; }
  .items { display: grid; gap: 8px; }
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  .item .name { font-weight: bold; }
  .item .price { color: var(--muted); font-size: 13px; }
  .item select { width: 84px; flex-shrink: 0; }
  .total { text-align: right; margin-top: 8px; font-weight: bold; }
  .error-msg { color: var(--error); font-size: 13px; margin-top: 4px; display: none; }
  .invalid .error-msg { display: block; }
  .invalid input, .invalid .items { border-color: var(--error); }
  button {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .status { margin-top: 12px; font-size: 14px; text-align: center; }
  .status.err { color: var(--error); }
  .done { text-align: center; display: none; }
  .done h2 { color: var(--ok); margin-top: 0; }
  .note { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }
  .hp { position: absolute; left: -9999px; }
</style>
</head>
<body><script>document.write(new URLSearchParams(location.search).get('mode')==='fail'?"<div role=\"note\" style=\"position:sticky;top:0;z-index:99999;background:#2F5D62;color:#fff;font:14px/1.7 system-ui,sans-serif;padding:8px 12px;text-align:center\">\u3010\u691c\u8a3c\u7528\u30c7\u30e2\uff5cA2\u3011\u67b6\u7a7a\u306e\u304a\u5e97\u3067\u3059\u3002\u5b9f\u969b\u306b\u306f\u9001\u4fe1\u3055\u308c\u307e\u305b\u3093\u3002<br><a href=\"A2-before.html\" style=\"color:#F2B544\">\u8a2d\u5b9a\u524d</a>\u3000<a href=\"A2.html?mode=ok\" style=\"color:#F2B544\">\u5c4a\u3044\u305f\u5834\u5408</a>\u3000<a href=\"A2.html?mode=fail\" style=\"color:#fff;font-weight:700;text-decoration:none;border-bottom:2px solid #F2B544\">\u9001\u4fe1\u5148\u30a8\u30e9\u30fc</a>\u3000<a href=\"A2-reply.html\" style=\"color:#F2B544\">AI\u306e\u8aac\u660e\u6587</a>\u3000<a href=\"./\" style=\"color:#F2B544\">\u4e00\u89a7\u3078</a></div>":"<div role=\"note\" style=\"position:sticky;top:0;z-index:99999;background:#2F5D62;color:#fff;font:14px/1.7 system-ui,sans-serif;padding:8px 12px;text-align:center\">\u3010\u691c\u8a3c\u7528\u30c7\u30e2\uff5cA2\u3011\u67b6\u7a7a\u306e\u304a\u5e97\u3067\u3059\u3002\u5b9f\u969b\u306b\u306f\u9001\u4fe1\u3055\u308c\u307e\u305b\u3093\u3002<br><a href=\"A2-before.html\" style=\"color:#F2B544\">\u8a2d\u5b9a\u524d</a>\u3000<a href=\"A2.html?mode=ok\" style=\"color:#fff;font-weight:700;text-decoration:none;border-bottom:2px solid #F2B544\">\u5c4a\u3044\u305f\u5834\u5408</a>\u3000<a href=\"A2.html?mode=fail\" style=\"color:#F2B544\">\u9001\u4fe1\u5148\u30a8\u30e9\u30fc</a>\u3000<a href=\"A2-reply.html\" style=\"color:#F2B544\">AI\u306e\u8aac\u660e\u6587</a>\u3000<a href=\"./\" style=\"color:#F2B544\">\u4e00\u89a7\u3078</a></div>")</script>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🍞</div>
    <h1>こむぎ堂</h1>
    <p>パンのご予約フォーム</p>
  </header>

  <form id="reserveForm" novalidate>
    <div class="field" id="f-name">
      <label for="name">お名前<span class="req">必須</span></label>
      <input type="text" id="name" name="お名前" autocomplete="name" placeholder="例）小麦 花子" required>
      <div class="error-msg">お名前を入力してください。</div>
    </div>

    <div class="field" id="f-tel">
      <label for="tel">電話番号<span class="req">必須</span></label>
      <input type="tel" id="tel" name="電話番号" autocomplete="tel" inputmode="tel" placeholder="例）090-1234-5678" required>
      <div class="error-msg">正しい電話番号を入力してください（数字10〜11桁）。</div>
    </div>

    <div class="field" id="f-date">
      <label for="date">受け取り日<span class="req">必須</span></label>
      <input type="date" id="date" name="受け取り日" required>
      <div class="hint">ご予約は翌日以降、30日先までの日付でお願いします。</div>
      <div class="error-msg">受け取り日を選んでください。</div>
    </div>

    <fieldset id="f-items">
      <legend>商品<span class="req">必須</span></legend>
      <div class="items" id="items"></div>
      <div class="total">合計 <span id="total">¥0</span>（税込）</div>
      <div class="error-msg">商品を1つ以上選んでください。</div>
    </fieldset>

    <div class="field">
      <label for="memo">備考</label>
      <textarea id="memo" name="備考" rows="3" placeholder="受け取り時間のご希望、スライスの有無など"></textarea>
    </div>

    <!-- スパム対策（人には見えない欄） -->
    <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button type="submit" id="submitBtn">予約を送信する</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>

  <div class="done" id="done">
    <h2>ご予約を受け付けました</h2>
    <p id="doneText"></p>
    <p>内容の確認のため、お店からお電話することがあります。<br>ご来店をお待ちしております。</p>
  </div>

  <p class="note">ご予約・お問い合わせ：こむぎ堂</p>
</div>

<script>
/* =========================================================
   ▼ お店の方へ：ここだけ設定してください ▼
   予約内容をメールで受け取るための送信先URLです。
   Formspree（https://formspree.io）で無料のフォームを作成し、
   表示される「https://formspree.io/f/xxxxxxx」の形のURLを
   下の '' の中に貼り付けてください。
   ========================================================= */
const FORM_ENDPOINT = 'https://formspree.io/f/test123';

/* 商品リスト（名前と税込価格は自由に書き換えてください） */
const PRODUCTS = [
  { name: '食パン（1斤）',       price: 420 },
  { name: '食パン（1.5斤）',     price: 600 },
  { name: 'クロワッサン',         price: 240 },
  { name: 'あんぱん',             price: 200 },
  { name: 'メロンパン',           price: 220 },
  { name: 'カレーパン',           price: 260 },
  { name: 'バゲット',             price: 350 },
  { name: 'くるみとレーズンのカンパーニュ', price: 680 },
];
const MAX_QTY = 10;

/* ---- ここから下は変更不要です ---- */
const $ = (id) => document.getElementById(id);
const yen = (n) => '¥' + n.toLocaleString('ja-JP');

// 商品欄を作る
const itemsEl = $('items');
PRODUCTS.forEach((p, i) => {
  const row = document.createElement('div');
  row.className = 'item';
  const opts = Array.from({ length: MAX_QTY + 1 }, (_, n) => `<option value="${n}">${n}個</option>`).join('');
  row.innerHTML = `
    <div><div class="name">${p.name}</div><div class="price">${yen(p.price)}</div></div>
    <select id="qty${i}" aria-label="${p.name}の個数">${opts}</select>`;
  itemsEl.appendChild(row);
});
itemsEl.addEventListener('change', () => {
  $('total').textContent = yen(calcTotal());
  if (selectedItems().length) $('f-items').classList.remove('invalid');
});

function selectedItems() {
  return PRODUCTS
    .map((p, i) => ({ ...p, qty: Number($('qty' + i).value) }))
    .filter((p) => p.qty > 0);
}
function calcTotal() {
  return selectedItems().reduce((s, p) => s + p.price * p.qty, 0);
}

// 受け取り日：翌日〜30日後
function ymd(d) {
  const z = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
const today = new Date();
const minD = new Date(today); minD.setDate(today.getDate() + 1);
const maxD = new Date(today); maxD.setDate(today.getDate() + 30);
$('date').min = ymd(minD);
$('date').max = ymd(maxD);

// 入力チェック
function validate() {
  let ok = true;
  const mark = (id, bad) => { $(id).classList.toggle('invalid', bad); if (bad) ok = false; };

  mark('f-name', $('name').value.trim() === '');

  const digits = $('tel').value.replace(/[‐－ー−\-\s()（）]/g, '')
    .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  mark('f-tel', !/^0\d{9,10}$/.test(digits));

  const d = $('date').value;
  mark('f-date', !d || d < $('date').min || d > $('date').max);

  mark('f-items', selectedItems().length === 0);
  return ok;
}
['name', 'tel', 'date'].forEach((id) =>
  $(id).addEventListener('input', () => $('f-' + id).classList.remove('invalid')));

// 送信
$('reserveForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = $('status');
  status.className = 'status';
  status.textContent = '';

  if (!validate()) {
    status.className = 'status err';
    status.textContent = '入力内容をご確認ください。';
    const firstBad = document.querySelector('.invalid');
    if (firstBad) firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  if (!FORM_ENDPOINT) {
    status.className = 'status err';
    status.textContent = '送信先が設定されていないため、現在このフォームからは送信できません。お手数ですがお電話でご予約ください。';
    return;
  }

  const items = selectedItems();
  const itemText = items.map((p) => `${p.name} × ${p.qty}個（${yen(p.price * p.qty)}）`).join('\n');
  const dateLabel = new Date($('date').value + 'T00:00:00')
    .toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

  const payload = {
    _subject: `【こむぎ堂 予約】${$('name').value.trim()} 様 / ${dateLabel}受け取り`,
    'お名前': $('name').value.trim(),
    '電話番号': $('tel').value.trim(),
    '受け取り日': dateLabel,
    '商品': itemText,
    '合計（税込）': yen(calcTotal()),
    '備考': $('memo').value.trim() || 'なし',
    _gotcha: document.querySelector('[name=_gotcha]').value,
  };

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = '送信中…';

  try {
    const res = await fetch(FORM_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    $('reserveForm').style.display = 'none';
    $('doneText').innerHTML =
      `${escapeHtml(payload['お名前'])} 様<br>受け取り日：${dateLabel}<br>` +
      items.map((p) => `${escapeHtml(p.name)} × ${p.qty}個`).join('<br>') +
      `<br>合計：${payload['合計（税込）']}`;
    $('done').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    status.className = 'status err';
    status.textContent = '送信に失敗しました。通信環境をご確認のうえ、もう一度お試しいただくか、お電話でご予約ください。';
    btn.disabled = false;
    btn.textContent = '予約を送信する';
  }
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
