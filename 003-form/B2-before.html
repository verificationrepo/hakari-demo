<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こむぎ堂 ご予約フォーム</title>
<!--
  ============================================================
  ★ お店の方へ：変更が必要なのは下の「設定」の1か所だけです ★
  ============================================================
  このフォームは「FormSubmit（フォームサブミット）」という
  無料サービスを使って、送信内容をお店のメールに届けます。
  アカウント登録・サーバーは不要です。

  【やること】
  1. このファイルをメモ帳などで開く
  2. 下の「shop@example.com」を、お店で受け取りたい
     メールアドレスに書きかえて保存する（1か所だけ）
  3. 公開したあと、自分で一度テスト送信する
  4. 届いた「確認メール（Activate Form）」のボタンを押す
     → これ以降、お客様の予約がメールで届きます
  ============================================================
-->
<script>
  // ▼▼▼ 設定：ここだけ書きかえてください ▼▼▼
  const SHOP_EMAIL = "shop@example.com";
  // ▲▲▲ 設定ここまで ▲▲▲
</script>
<style>
  :root {
    --bg: #fbf6ee;
    --card: #ffffff;
    --ink: #3b2a1a;
    --muted: #7a6650;
    --accent: #b8692e;
    --accent-dark: #94511f;
    --line: #e7dccb;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 56px; }
  header { text-align: center; margin-bottom: 24px; }
  header .logo { font-size: 40px; line-height: 1; }
  header h1 { margin: 8px 0 4px; font-size: 26px; letter-spacing: .08em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 20px;
  }
  .field { margin-bottom: 22px; }
  label, .label { display: block; font-weight: bold; margin-bottom: 6px; }
  .req {
    display: inline-block; margin-left: 6px; padding: 0 6px;
    font-size: 11px; color: #fff; background: var(--accent);
    border-radius: 4px; vertical-align: 2px;
  }
  .hint { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  input[type="text"], input[type="tel"], input[type="date"], select, textarea {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px; background: #fffdf9; color: var(--ink);
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  textarea { min-height: 80px; resize: vertical; }
  .items { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 12px; border-top: 1px solid var(--line);
  }
  .item:first-child { border-top: none; }
  .item .name { flex: 1; }
  .item .price { display: block; font-size: 13px; color: var(--muted); }
  .item select { width: 84px; padding: 8px; }
  .total { text-align: right; margin-top: 8px; font-weight: bold; }
  .error-msg { color: var(--error); font-size: 14px; margin-top: 6px; display: none; }
  .error-msg.show { display: block; }
  button {
    width: 100%; padding: 16px; font-size: 18px; font-weight: bold;
    color: #fff; background: var(--accent); border: none; border-radius: 10px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--accent-dark); }
  .note { font-size: 13px; color: var(--muted); margin-top: 16px; }
  .hidden { display: none; }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
</style>
</head>
<body><div role="note" style="position:sticky;top:0;z-index:99999;background:#2F5D62;color:#fff;font:14px/1.7 system-ui,sans-serif;padding:8px 12px;text-align:center">【検証用デモ｜B2】架空のお店です。実際には送信されません。<br><a href="B2-before.html" style="color:#fff;font-weight:700;text-decoration:none;border-bottom:2px solid #F2B544">設定前</a>　<a href="B2.html?mode=ok" style="color:#F2B544">届いた場合</a>　<a href="B2.html?mode=fail" style="color:#F2B544">送信先エラー</a>　<a href="B2-reply.html" style="color:#F2B544">AIの説明文</a>　<a href="./" style="color:#F2B544">一覧へ</a></div>
<div class="wrap">
  <header>
    <div class="logo">🍞</div>
    <h1>こむぎ堂</h1>
    <p>パンのご予約フォーム</p>
  </header>

  <form id="reserveForm" method="POST">
    <!-- FormSubmit 用の設定（さわらなくてOK） -->
    <input type="hidden" name="_subject" value="【こむぎ堂】新しいご予約が届きました">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="true">
    <input type="hidden" name="ご注文内容" id="orderSummary">
    <input type="hidden" name="合計金額（目安）" id="orderTotal">
    <!-- いたずら送信よけ（人には見えません） -->
    <input type="text" name="_honey" class="hidden" tabindex="-1" autocomplete="off">

    <div class="field">
      <label for="name">お名前<span class="req">必須</span></label>
      <input type="text" id="name" name="お名前" required autocomplete="name" placeholder="例：山田 花子">
    </div>

    <div class="field">
      <label for="tel">電話番号<span class="req">必須</span></label>
      <input type="tel" id="tel" name="電話番号" required autocomplete="tel"
             inputmode="tel" pattern="[0-9０-９\-－ ]{10,14}" placeholder="例：090-1234-5678">
      <p class="hint">ご予約内容の確認でお電話することがあります。</p>
    </div>

    <div class="field">
      <label for="date">受け取り日<span class="req">必須</span></label>
      <input type="date" id="date" name="受け取り日" required>
      <p class="hint">明日以降の日付をお選びください。</p>
    </div>

    <div class="field">
      <label for="time">受け取り時間帯</label>
      <select id="time" name="受け取り時間帯">
        <option value="指定なし">指定なし</option>
        <option>10:00〜12:00</option>
        <option>12:00〜14:00</option>
        <option>14:00〜16:00</option>
        <option>16:00〜18:00</option>
      </select>
    </div>

    <div class="field">
      <span class="label">商品<span class="req">必須</span></span>
      <p class="hint" style="margin:0 0 8px">ご希望の商品の個数を選んでください。</p>
      <div class="items" id="items"></div>
      <div class="total" id="totalView">合計 0円</div>
      <p class="error-msg" id="itemError">商品を1つ以上お選びください。</p>
    </div>

    <div class="field">
      <label for="memo">その他ご要望</label>
      <textarea id="memo" name="ご要望" placeholder="例：食パンは2枚切りでお願いします"></textarea>
    </div>

    <button type="submit">予約を送信する</button>
    <p class="note">
      ※ 送信後、ロボットでないことの確認画面が出る場合があります。チェックを入れて進んでください。<br>
      ※ ご予約は、お店からの確認をもって確定となります。お急ぎの場合はお電話ください。
    </p>
  </form>

  <footer>&copy; こむぎ堂</footer>
</div>

<script>
  // ▼ 商品リスト（商品や値段を変えたいときは、ここを書きかえます）
  const PRODUCTS = [
    { name: "食パン（1斤）",       price: 400 },
    { name: "バゲット",            price: 350 },
    { name: "クロワッサン",        price: 220 },
    { name: "あんぱん",            price: 180 },
    { name: "メロンパン",          price: 200 },
    { name: "カレーパン",          price: 230 },
    { name: "季節のフルーツデニッシュ", price: 320 }
  ];
  const MAX_QTY = 10;

  const form = document.getElementById("reserveForm");
  form.action = "https://formsubmit.co/" + SHOP_EMAIL;

  // 商品の一覧を作る
  const itemsBox = document.getElementById("items");
  PRODUCTS.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "item";
    let options = "";
    for (let n = 0; n <= MAX_QTY; n++) options += `<option value="${n}">${n}個</option>`;
    row.innerHTML =
      `<label class="name" for="qty${i}" style="font-weight:normal;margin:0">${p.name}` +
      `<span class="price">${p.price.toLocaleString()}円</span></label>` +
      `<select id="qty${i}" data-index="${i}">${options}</select>`;
    itemsBox.appendChild(row);
  });

  function collect() {
    let total = 0;
    const lines = [];
    itemsBox.querySelectorAll("select").forEach(sel => {
      const qty = Number(sel.value);
      if (qty > 0) {
        const p = PRODUCTS[sel.dataset.index];
        total += p.price * qty;
        lines.push(`${p.name} × ${qty}個`);
      }
    });
    return { lines, total };
  }

  itemsBox.addEventListener("change", () => {
    const { lines, total } = collect();
    document.getElementById("totalView").textContent = "合計 " + total.toLocaleString() + "円";
    if (lines.length) document.getElementById("itemError").classList.remove("show");
  });

  // 受け取り日は明日以降
  const d = new Date();
  d.setDate(d.getDate() + 1);
  const pad = n => String(n).padStart(2, "0");
  document.getElementById("date").min = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  form.addEventListener("submit", e => {
    if (SHOP_EMAIL === "shop@example.com") {
      e.preventDefault();
      alert("【お店の方へ】まだ受け取り用のメールアドレスが設定されていません。\nファイル上部の SHOP_EMAIL を書きかえてください。");
      return;
    }
    const { lines, total } = collect();
    if (!lines.length) {
      e.preventDefault();
      const err = document.getElementById("itemError");
      err.classList.add("show");
      err.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    document.getElementById("orderSummary").value = lines.join(" / ");
    document.getElementById("orderTotal").value = total.toLocaleString() + "円";
  });
</script>
</body>
</html>
