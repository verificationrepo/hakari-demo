<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こむぎ堂 ご予約フォーム</title>
<!--
  ============================================================
  【お店の方へ】設定はここ1か所だけです
  ------------------------------------------------------------
  1. https://formspree.io で無料アカウントを作る（メールアドレスだけでOK）
  2. 「New Form」でフォームを作ると「https://formspree.io/f/xxxxxxx」
     という送信先URLが表示されます
  3. 下の FORM_ENDPOINT の "" の中に、そのURLを貼り付けて保存
  これで、予約が届くたびに登録したメールアドレスへメールが届きます。
  ============================================================
-->
<script>
  const FORM_ENDPOINT = ""; // 例: "https://formspree.io/f/abcdwxyz"
</script>
<style>
  :root {
    --bg: #fbf6ee;
    --card: #ffffff;
    --text: #3b2a1a;
    --muted: #7a6650;
    --accent: #b8742a;
    --accent-dark: #965b1c;
    --line: #e8dccb;
    --error: #c0392b;
    --ok: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1a15;
      --card: #2a231c;
      --text: #f2e8da;
      --muted: #bfae98;
      --accent: #e0a35a;
      --accent-dark: #c98a40;
      --line: #43382c;
      --error: #ff7a6b;
      --ok: #6fcf97;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
  header { text-align: center; margin-bottom: 24px; }
  .logo { font-size: 44px; line-height: 1; }
  h1 { font-size: 26px; margin: 8px 0 4px; letter-spacing: .1em; }
  .lead { color: var(--muted); font-size: 14px; margin: 0; }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 20px;
  }
  .field { margin-bottom: 20px; }
  label, .label { display: block; font-weight: bold; margin-bottom: 6px; }
  .req {
    font-size: 11px; background: var(--accent); color: #fff;
    border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  input[type=text], input[type=tel], input[type=date], select, textarea {
    width: 100%; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .items { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item .name { flex: 1; }
  .item .price { color: var(--muted); font-size: 13px; }
  .item select { width: 80px; padding: 6px 8px; }
  .total { text-align: right; margin-top: 8px; font-weight: bold; }
  button {
    width: 100%; font-size: 18px; font-weight: bold; padding: 14px;
    border: none; border-radius: 10px; background: var(--accent); color: #fff;
    cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; display: none; font-size: 14px; }
  .msg.error { display: block; border: 1px solid var(--error); color: var(--error); }
  .msg.ok { display: block; border: 1px solid var(--ok); color: var(--ok); }
  .done { text-align: center; padding: 24px 8px; }
  .done .big { font-size: 40px; }
  .hp { position: absolute; left: -9999px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
</style>
</head>
<body><div role="note" style="position:sticky;top:0;z-index:99999;background:#2F5D62;color:#fff;font:14px/1.7 system-ui,sans-serif;padding:8px 12px;text-align:center">【検証用デモ｜B1】架空のお店です。実際には送信されません。<br><a href="B1-before.html" style="color:#fff;font-weight:700;text-decoration:none;border-bottom:2px solid #F2B544">設定前</a>　<a href="B1.html?mode=ok" style="color:#F2B544">届いた場合</a>　<a href="B1.html?mode=fail" style="color:#F2B544">送信先エラー</a>　<a href="B1-reply.html" style="color:#F2B544">AIの説明文</a>　<a href="./" style="color:#F2B544">一覧へ</a></div>
<div class="wrap">
  <header>
    <div class="logo">🍞</div>
    <h1>こむぎ堂</h1>
    <p class="lead">パンのご予約フォーム</p>
  </header>

  <form id="reserveForm" novalidate>
    <div class="field">
      <label for="name">お名前<span class="req">必須</span></label>
      <input type="text" id="name" name="お名前" autocomplete="name" placeholder="例）山田 花子" required>
    </div>

    <div class="field">
      <label for="tel">電話番号<span class="req">必須</span></label>
      <input type="tel" id="tel" name="電話番号" autocomplete="tel" inputmode="tel" placeholder="例）090-1234-5678" required>
      <div class="hint">確認のためお電話することがあります。</div>
    </div>

    <div class="field">
      <label for="date">受け取り日<span class="req">必須</span></label>
      <input type="date" id="date" name="受け取り日" required>
      <div class="hint">ご予約は翌日以降・2か月先までお受けしています。</div>
    </div>

    <div class="field">
      <span class="label">ご予約の商品<span class="req">必須</span></span>
      <div class="items" id="items"></div>
      <div class="total" id="total">合計 0点 / 0円</div>
    </div>

    <div class="field">
      <label for="note">ご要望など（任意）</label>
      <textarea id="note" name="ご要望" rows="3" placeholder="例）食パンは2枚切りでお願いします"></textarea>
    </div>

    <!-- いたずら送信よけ（人には見えません） -->
    <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">

    <button type="submit" id="submitBtn">予約を送信する</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>

  <footer>
    受け取り時にお店でお支払いください。<br>
    ご予約の変更・キャンセルはお電話でお願いします。
  </footer>
</div>

<script>
  // ====== 商品リスト（名前と値段はここで自由に変えられます） ======
  const PRODUCTS = [
    { name: "食パン（1斤）", price: 380 },
    { name: "山型食パン（1.5斤）", price: 520 },
    { name: "クロワッサン", price: 220 },
    { name: "あんパン", price: 180 },
    { name: "メロンパン", price: 200 },
    { name: "カレーパン", price: 240 },
    { name: "バゲット", price: 320 },
    { name: "季節のフルーツデニッシュ", price: 300 },
  ];
  const MAX_QTY = 10;

  // 商品リストを表示
  const itemsEl = document.getElementById("items");
  PRODUCTS.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "item";
    let opts = "";
    for (let n = 0; n <= MAX_QTY; n++) opts += `<option value="${n}">${n}</option>`;
    row.innerHTML = `
      <div class="name">${p.name}<div class="price">${p.price.toLocaleString()}円</div></div>
      <select data-index="${i}" aria-label="${p.name}の個数">${opts}</select>`;
    itemsEl.appendChild(row);
  });

  const qtySelects = () => [...itemsEl.querySelectorAll("select")];
  function updateTotal() {
    let count = 0, sum = 0;
    qtySelects().forEach(s => {
      const q = Number(s.value);
      count += q;
      sum += q * PRODUCTS[s.dataset.index].price;
    });
    document.getElementById("total").textContent = `合計 ${count}点 / ${sum.toLocaleString()}円`;
    return { count, sum };
  }
  itemsEl.addEventListener("change", updateTotal);

  // 受け取り日：翌日〜60日後
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const dateEl = document.getElementById("date");
  const t = new Date(); t.setDate(t.getDate() + 1);
  const m = new Date(); m.setDate(m.getDate() + 60);
  dateEl.min = fmt(t); dateEl.max = fmt(m);

  // 送信
  const form = document.getElementById("reserveForm");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");

  function showError(text) { msg.className = "msg error"; msg.textContent = text; }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "msg"; msg.textContent = "";

    const name = form.querySelector("#name").value.trim();
    const tel = form.querySelector("#tel").value.trim();
    const date = dateEl.value;
    const { count, sum } = updateTotal();

    if (!name) return showError("お名前を入力してください。");
    if (!/^[0-9０-９\-－ー\s()]{10,15}$/.test(tel)) return showError("電話番号を正しく入力してください（例：090-1234-5678）。");
    if (!date) return showError("受け取り日を選んでください。");
    if (date < dateEl.min || date > dateEl.max) return showError("受け取り日は翌日から2か月先までの日付を選んでください。");
    if (count === 0) return showError("商品を1つ以上選んでください。");

    if (!FORM_ENDPOINT) {
      return showError("【お店の方へ】まだ送信先が設定されていません。HTMLファイル上部の FORM_ENDPOINT を設定してください。");
    }

    const lines = qtySelects()
      .filter(s => Number(s.value) > 0)
      .map(s => `${PRODUCTS[s.dataset.index].name} × ${s.value}`);

    const data = new FormData(form);
    data.append("ご予約商品", lines.join("\n"));
    data.append("合計", `${count}点 / ${sum.toLocaleString()}円`);
    data.append("_subject", `【予約】${date} 受け取り ${name} 様`);

    btn.disabled = true; btn.textContent = "送信中…";
    try {
      const res = await fetch(FORM_ENDPOINT, {
        method: "POST",
        body: data,
        headers: { "Accept": "application/json" },
      });
      if (!res.ok) throw new Error();
      const [y, mo, d] = date.split("-");
      form.innerHTML = `
        <div class="done">
          <div class="big">🥐</div>
          <h2>ご予約ありがとうございます</h2>
          <p>${Number(mo)}月${Number(d)}日のお受け取りで承りました。<br>
          ご来店をお待ちしております。</p>
          <p class="hint">内容の確認のため、お店からお電話することがあります。</p>
        </div>`;
    } catch {
      btn.disabled = false; btn.textContent = "予約を送信する";
      showError("送信できませんでした。通信状況をご確認のうえ、もう一度お試しいただくか、お電話でご予約ください。");
    }
  });
</script>
</body>
</html>
